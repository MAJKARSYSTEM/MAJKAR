<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJKAR - Moje Auto</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.88)),
        url("background.jpg") center/cover no-repeat;
      color: white;
      padding: 35px;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
    }

    .topbar {
      padding: 22px 26px;
      border: 1px solid #ff1a1a;
      border-radius: 14px;
      background: rgba(0,0,0,.78);
      box-shadow: 0 0 25px rgba(255,0,0,.35);
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 34px;
      letter-spacing: 5px;
      text-shadow: 0 0 16px red;
    }

    .topbar p {
      margin-top: 8px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .panel {
      border: 1px solid #ff1a1a;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(255,0,0,.13), transparent 40%),
        rgba(0,0,0,.84);
      box-shadow:
        0 0 25px rgba(255,0,0,.35),
        inset 0 0 25px rgba(255,0,0,.08);
      padding: 30px;
    }

    .panel h2 {
      font-size: 26px;
      margin-bottom: 22px;
      text-shadow: 0 0 12px red;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #bbb;
    }

    .field input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      background: #111;
      border: 1px solid #ff1a1a;
      color: white;
      outline: none;
      font-size: 14px;
      box-shadow: inset 0 0 12px rgba(255,0,0,.12);
    }

    .field input:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .vin-field {
      grid-column: 1 / -1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 10px;
    }

    button {
      height: 54px;
      border: 1px solid #ff1a1a;
      border-radius: 8px;
      color: white;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      background: linear-gradient(90deg, #1a0000, #b00000, #1a0000);
      box-shadow: 0 0 14px rgba(255,0,0,.45);
    }

    button:hover {
      filter: brightness(1.15);
    }

    .back-btn {
      background: linear-gradient(90deg, #111, #333, #111);
    }

    .edit-btn {
      background: linear-gradient(90deg, #00111a, #005577, #00111a);
    }

    .message {
      margin-top: 18px;
      min-height: 22px;
      text-align: center;
      color: #66ff66;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .preview {
      margin-top: 28px;
      padding: 22px;
      border: 1px solid rgba(255,0,0,.45);
      border-radius: 12px;
      background: rgba(0,0,0,.55);
    }

    .preview h3 {
      margin-bottom: 14px;
      color: #ff3030;
      letter-spacing: 2px;
    }

    .preview p {
      margin-bottom: 8px;
      color: #ccc;
      font-size: 13px;
    }

    .preview span {
      color: white;
      font-weight: 900;
    }

    @media (max-width: 720px) {
      body {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .vin-field {
        grid-column: auto;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .topbar h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">
      <h1>MOJE AUTO</h1>
      <p>MAJKAR VEHICLE PROFILE MODULE / FIRESTORE CLOUD SYNC</p>
    </header>

    <section class="panel">
      <h2>Profil pojazdu</h2>

      <form id="carForm">
        <div class="form-grid">
          <div class="field">
            <label>MARKA</label>
            <input id="brand" type="text" placeholder="np. Audi" required>
          </div>

          <div class="field">
            <label>MODEL</label>
            <input id="model" type="text" placeholder="np. A8" required>
          </div>

          <div class="field">
            <label>GENERACJA</label>
            <input id="generation" type="text" placeholder="np. D3 / 8P / C7">
          </div>

          <div class="field">
            <label>ROK</label>
            <input id="year" type="number" placeholder="np. 2006" min="1900" max="2100">
          </div>

          <div class="field vin-field">
            <label>VIN</label>
            <input id="vin" type="text" placeholder="17-znakowy numer VIN" maxlength="17">
          </div>
        </div>

        <div class="buttons">
          <button type="button" class="edit-btn" id="editBtn">EDYTUJ</button>
          <button type="submit" id="saveBtn">ZAPISZ AUTO</button>
          <button type="button" class="back-btn" id="backBtn">POWRÓT</button>
        </div>
      </form>

      <div id="message" class="message">Ładowanie danych z Firestore...</div>

      <div class="preview">
        <h3>AKTUALNIE ZAPISANE AUTO</h3>
        <p>Marka: <span id="previewBrand">Brak danych</span></p>
        <p>Model: <span id="previewModel">Brak danych</span></p>
        <p>Generacja: <span id="previewGeneration">Brak danych</span></p>
        <p>Rok: <span id="previewYear">Brak danych</span></p>
        <p>VIN: <span id="previewVin">Brak danych</span></p>
      </div>
    </section>

  </div>

  <script type="module">
    import {
      auth,
      db,
      doc,
      setDoc,
      getDoc,
      onAuthStateChanged
    } from "./firebase-config.js";

    const form = document.getElementById("carForm");
    const editBtn = document.getElementById("editBtn");
    const backBtn = document.getElementById("backBtn");
    const message = document.getElementById("message");

    let currentUser = null;

    const inputs = {
      brand: document.getElementById("brand"),
      model: document.getElementById("model"),
      generation: document.getElementById("generation"),
      year: document.getElementById("year"),
      vin: document.getElementById("vin")
    };

    const preview = {
      brand: document.getElementById("previewBrand"),
      model: document.getElementById("previewModel"),
      generation: document.getElementById("previewGeneration"),
      year: document.getElementById("previewYear"),
      vin: document.getElementById("previewVin")
    };

    function setInputsDisabled(disabled) {
      Object.values(inputs).forEach(input => {
        input.disabled = disabled;
      });
    }

    function showMessage(text, success = true) {
      message.textContent = text;
      message.style.color = success ? "#66ff66" : "#ff6666";
    }

    function updatePreview(car) {
      preview.brand.textContent = car.brand || "Brak danych";
      preview.model.textContent = car.model || "Brak danych";
      preview.generation.textContent = car.generation || "Brak danych";
      preview.year.textContent = car.year || "Brak danych";
      preview.vin.textContent = car.vin || "Brak danych";
    }

    function fillInputs(car) {
      inputs.brand.value = car.brand || "";
      inputs.model.value = car.model || "";
      inputs.generation.value = car.generation || "";
      inputs.year.value = car.year || "";
      inputs.vin.value = car.vin || "";
    }

    async function loadCarFromFirestore(user) {
      try {
        const carRef = doc(db, "users", user.uid, "cars", "mainCar");
        const carSnap = await getDoc(carRef);

        if (carSnap.exists()) {
          const car = carSnap.data();

          fillInputs(car);
          updatePreview(car);
          setInputsDisabled(true);

          showMessage("Dane auta wczytane z Firestore.", true);
        } else {
          setInputsDisabled(false);
          showMessage("Brak zapisanego auta. Uzupełnij dane i kliknij ZAPISZ AUTO.", true);
        }
      } catch (error) {
        console.error(error);
        showMessage("Błąd odczytu z Firestore: " + error.code, false);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;
      await loadCarFromFirestore(user);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentUser) {
        showMessage("Brak zalogowanego użytkownika.", false);
        return;
      }

      const car = {
        brand: inputs.brand.value.trim(),
        model: inputs.model.value.trim(),
        generation: inputs.generation.value.trim(),
        year: inputs.year.value.trim(),
        vin: inputs.vin.value.trim().toUpperCase(),
        updatedAt: new Date().toISOString()
      };

      try {
        const carRef = doc(db, "users", currentUser.uid, "cars", "mainCar");
        await setDoc(carRef, car);

        updatePreview(car);
        setInputsDisabled(true);

        showMessage("Auto zapisane w Firestore.", true);
      } catch (error) {
        console.error(error);
        showMessage("Błąd zapisu do Firestore: " + error.code, false);
      }
    });

    editBtn.addEventListener("click", () => {
      setInputsDisabled(false);
      showMessage("Tryb edycji włączony.", true);
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
