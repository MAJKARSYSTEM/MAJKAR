<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJKAR - Moje Auto</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.9)),
        url("background.jpg") center/cover no-repeat;
      color: white;
      padding: 35px;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar {
      padding: 22px 26px;
      border: 1px solid #ff1a1a;
      border-radius: 14px;
      background: rgba(0,0,0,.78);
      box-shadow: 0 0 25px rgba(255,0,0,.35);
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .topbar h1 {
      font-size: 34px;
      letter-spacing: 5px;
      text-shadow: 0 0 16px red;
    }

    .topbar p {
      margin-top: 8px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .counter {
      color: #ff3030;
      font-size: 13px;
      letter-spacing: 2px;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 22px;
    }

    .panel {
      border: 1px solid #ff1a1a;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(255,0,0,.13), transparent 40%),
        rgba(0,0,0,.84);
      box-shadow:
        0 0 25px rgba(255,0,0,.35),
        inset 0 0 25px rgba(255,0,0,.08);
      padding: 26px;
    }

    .panel h2 {
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px red;
    }

    .cars-list {
      display: grid;
      gap: 12px;
    }

    .car-item {
      padding: 16px;
      border: 1px solid rgba(255,0,0,.45);
      border-radius: 10px;
      background: rgba(0,0,0,.58);
      transition: .2s;
    }

    .car-item.active {
      border-color: #ff3030;
      box-shadow: 0 0 18px rgba(255,0,0,.55);
    }

    .car-item h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: white;
    }

    .car-item p {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }

    .car-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .empty {
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #bbb;
    }

    .field input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      background: #111;
      border: 1px solid #ff1a1a;
      color: white;
      outline: none;
      font-size: 14px;
      box-shadow: inset 0 0 12px rgba(255,0,0,.12);
    }

    .vin-field {
      grid-column: 1 / -1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    button {
      min-height: 46px;
      border: 1px solid #ff1a1a;
      border-radius: 8px;
      color: white;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(90deg, #1a0000, #b00000, #1a0000);
      box-shadow: 0 0 14px rgba(255,0,0,.45);
      padding: 0 10px;
      font-size: 11px;
    }

    button:hover {
      filter: brightness(1.15);
    }

    .read-btn {
      background: linear-gradient(90deg, #1a0000, #b00000, #1a0000);
    }

    .edit-btn {
      background: linear-gradient(90deg, #00111a, #005577, #00111a);
    }

    .new-btn {
      background: linear-gradient(90deg, #001a08, #087a26, #001a08);
    }

    .delete-btn {
      background: linear-gradient(90deg, #240000, #8b0000, #240000);
      border-color: #ff3b3b;
    }

    .back-btn {
      background: linear-gradient(90deg, #111, #333, #111);
    }

    .message {
      margin-top: 18px;
      min-height: 22px;
      text-align: center;
      color: #66ff66;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .counter {
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .vin-field {
        grid-column: auto;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .topbar h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">
      <div>
        <h1>MOJE AUTO</h1>
        <p>CZYTAJ = DASHBOARD AUTA / EDYTUJ = ZMIANA DANYCH</p>
      </div>

      <div class="counter" id="carCounter">Ładowanie...</div>
    </header>

    <main class="layout">

      <section class="panel">
        <h2>Twoje auta</h2>
        <div id="carsList" class="cars-list">
          <p class="empty">Ładowanie aut z Firestore...</p>
        </div>
      </section>

      <section class="panel">
        <h2 id="formTitle">Dodaj auto</h2>

        <form id="carForm">
          <div class="form-grid">
            <div class="field">
              <label>MARKA</label>
              <input id="brand" type="text" placeholder="np. Audi" required>
            </div>

            <div class="field">
              <label>MODEL</label>
              <input id="model" type="text" placeholder="np. A8" required>
            </div>

            <div class="field">
              <label>GENERACJA</label>
              <input id="generation" type="text" placeholder="np. D3 / 8P / C7">
            </div>

            <div class="field">
              <label>ROK</label>
              <input id="year" type="number" placeholder="np. 2006" min="1900" max="2100">
            </div>

            <div class="field vin-field">
              <label>VIN</label>
              <input id="vin" type="text" placeholder="17-znakowy numer VIN" maxlength="17">
            </div>
          </div>

          <div class="buttons">
            <button type="button" class="new-btn" id="newBtn">NOWE AUTO</button>
            <button type="submit" id="saveBtn">ZAPISZ</button>
            <button type="button" class="delete-btn" id="deleteBtn">USUŃ AUTO</button>
            <button type="button" class="back-btn" id="backBtn">POWRÓT</button>
          </div>
        </form>

        <div id="message" class="message"></div>
      </section>

    </main>

  </div>

  <script type="module">
    import {
      auth,
      db,
      doc,
      setDoc,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      onAuthStateChanged
    } from "./firebase-config.js";

    const MAX_CARS = 10;

    const form = document.getElementById("carForm");
    const newBtn = document.getElementById("newBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const backBtn = document.getElementById("backBtn");
    const message = document.getElementById("message");
    const carsList = document.getElementById("carsList");
    const carCounter = document.getElementById("carCounter");
    const formTitle = document.getElementById("formTitle");

    let currentUser = null;
    let cars = [];
    let selectedCarId = null;
    let editMode = false;

    const inputs = {
      brand: document.getElementById("brand"),
      model: document.getElementById("model"),
      generation: document.getElementById("generation"),
      year: document.getElementById("year"),
      vin: document.getElementById("vin")
    };

    function showMessage(text, success = true) {
      message.textContent = text;
      message.style.color = success ? "#66ff66" : "#ff6666";
    }

    function clearForm() {
      selectedCarId = null;
      editMode = false;
      formTitle.textContent = "Dodaj auto";
      inputs.brand.value = "";
      inputs.model.value = "";
      inputs.generation.value = "";
      inputs.year.value = "";
      inputs.vin.value = "";
    }

    function fillForm(car) {
      inputs.brand.value = car.brand || "";
      inputs.model.value = car.model || "";
      inputs.generation.value = car.generation || "";
      inputs.year.value = car.year || "";
      inputs.vin.value = car.vin || "";
    }

    function getSelectedCar() {
      return cars.find(car => car.id === selectedCarId);
    }

    function renderCars() {
      carsList.innerHTML = "";
      carCounter.textContent = `AUTA: ${cars.length}/${MAX_CARS}`;

      if (cars.length === 0) {
        carsList.innerHTML = `<p class="empty">Nie masz jeszcze dodanego auta. Dodaj pierwsze auto po prawej stronie.</p>`;
        return;
      }

      cars.forEach(car => {
        const item = document.createElement("div");
        item.className = "car-item";
        if (car.id === selectedCarId) item.classList.add("active");

        item.innerHTML = `
          <h3>${car.brand || "Brak marki"} ${car.model || ""}</h3>
          <p>Generacja: ${car.generation || "Brak danych"}</p>
          <p>Rok: ${car.year || "Brak danych"}</p>
          <p>VIN: ${car.vin || "Brak danych"}</p>

          <div class="car-actions">
            <button type="button" class="read-btn">CZYTAJ</button>
            <button type="button" class="edit-btn">EDYTUJ</button>
          </div>
        `;

        const readBtn = item.querySelector(".read-btn");
        const editBtn = item.querySelector(".edit-btn");

        readBtn.addEventListener("click", () => {
          window.location.href = "car-dashboard.html?id=" + car.id;
        });

        editBtn.addEventListener("click", () => {
          selectedCarId = car.id;
          editMode = true;
          formTitle.textContent = "Edytuj auto";
          fillForm(car);
          renderCars();
          showMessage("Tryb edycji auta włączony. Zmień dane i kliknij ZAPISZ.");
        });

        carsList.appendChild(item);
      });
    }

    async function loadCars() {
      const carsRef = collection(db, "users", currentUser.uid, "cars");
      const snap = await getDocs(carsRef);

      cars = [];

      snap.forEach(docSnap => {
        cars.push({
          id: docSnap.id,
          ...docSnap.data()
        });
      });

      renderCars();
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;

      try {
        await loadCars();
        showMessage("Auta wczytane z Firestore.");
      } catch (error) {
        console.error(error);
        showMessage("Błąd odczytu Firestore: " + error.code, false);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentUser) {
        showMessage("Brak zalogowanego użytkownika.", false);
        return;
      }

      const car = {
        brand: inputs.brand.value.trim(),
        model: inputs.model.value.trim(),
        generation: inputs.generation.value.trim(),
        year: inputs.year.value.trim(),
        vin: inputs.vin.value.trim().toUpperCase(),
        updatedAt: new Date().toISOString()
      };

      try {
        if (editMode && selectedCarId) {
          const carRef = doc(db, "users", currentUser.uid, "cars", selectedCarId);
          await setDoc(carRef, car, { merge: true });

          showMessage("Auto zaktualizowane.");
        } else {
          if (cars.length >= MAX_CARS) {
            showMessage("Limit osiągnięty. Możesz dodać maksymalnie 10 aut.", false);
            return;
          }

          const carsRef = collection(db, "users", currentUser.uid, "cars");
          await addDoc(carsRef, {
            ...car,
            createdAt: new Date().toISOString()
          });

          showMessage("Nowe auto zapisane.");
        }

        clearForm();
        await loadCars();
      } catch (error) {
        console.error(error);
        showMessage("Błąd zapisu Firestore: " + error.code, false);
      }
    });

    newBtn.addEventListener("click", () => {
      if (cars.length >= MAX_CARS) {
        showMessage("Limit osiągnięty. Możesz dodać maksymalnie 10 aut.", false);
        return;
      }

      clearForm();
      renderCars();
      showMessage("Tryb dodawania nowego auta.");
    });

    deleteBtn.addEventListener("click", async () => {
      if (!currentUser) {
        showMessage("Brak zalogowanego użytkownika.", false);
        return;
      }

      if (!selectedCarId) {
        showMessage("Najpierw kliknij EDYTUJ przy aucie, które chcesz usunąć.", false);
        return;
      }

      const selectedCar = getSelectedCar();
      const carName = selectedCar
        ? `${selectedCar.brand || ""} ${selectedCar.model || ""}`.trim()
        : "wybrane auto";

      const confirmDelete = confirm("Czy na pewno chcesz usunąć: " + carName + "?");

      if (!confirmDelete) {
        showMessage("Usuwanie anulowane.", false);
        return;
      }

      try {
        const carRef = doc(db, "users", currentUser.uid, "cars", selectedCarId);
        await deleteDoc(carRef);

        clearForm();
        await loadCars();

        showMessage("Auto usunięte.");
      } catch (error) {
        console.error(error);
        showMessage("Błąd usuwania auta: " + error.code, false);
      }
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
