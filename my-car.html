<!DOCTYPE html>

<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJKAR - Moje Auto</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.9)),
        url('background.jpg') center/cover no-repeat;
      color: white;
      padding: 35px;
    }

    .page {
      max-width: 1300px;
      margin: 0 auto;
    }

    .panel {
      border: 1px solid #ff1a1a;
      border-radius: 16px;
      background: rgba(0,0,0,.82);
      box-shadow: 0 0 25px rgba(255,0,0,.35);
    }

    .topbar {
      padding: 24px 28px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: 36px;
      letter-spacing: 5px;
      text-shadow: 0 0 16px red;
    }

    .subtitle {
      margin-top: 8px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    button {
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid #ff1a1a;
      border-radius: 8px;
      background: linear-gradient(90deg, #1a0000, #b00000, #1a0000);
      color: white;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 11px;
      box-shadow: 0 0 14px rgba(255,0,0,.4);
    }

    button:hover {
      filter: brightness(1.15);
    }

    .secondary {
      background: linear-gradient(90deg, #111, #333, #111);
    }

    .edit-btn {
      background: linear-gradient(90deg, #00111a, #005577, #00111a);
    }

    .read-btn {
      background: linear-gradient(90deg, #001a00, #007700, #001a00);
    }

    .delete-btn {
      background: linear-gradient(90deg, #240000, #8b0000, #240000);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .summary-box {
      padding: 20px;
      text-align: center;
    }

    .summary-box p {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .summary-box span {
      color: #ff3030;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 0 12px red;
    }

    .panel-body {
      padding: 26px;
      margin-bottom: 28px;
    }

    .panel-body h2 {
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px red;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      background: #111;
      border: 1px solid #ff1a1a;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .car-card {
      padding: 22px;
      border: 1px solid rgba(255,0,0,.4);
      border-radius: 14px;
      background: rgba(0,0,0,.65);
      box-shadow: 0 0 18px rgba(255,0,0,.18);
    }

    .car-card h3 {
      font-size: 22px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px red;
    }

    .car-card p {
      font-size: 12px;
      color: #bbb;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .car-card strong {
      color: white;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      text-align: center;
      font-size: 12px;
    }

    .empty {
      color: #aaa;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-actions,
      .card-actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>

</head>
<body>

    <div>
      <h1>MOJE AUTO</h1>

</div>

  </section>

  <section class="panel panel-body">
    <h2>Twoje auta</h2>
    <div id="carsList" class="cars-grid"></div>
  </section>

</div>

<script type="module">
  import {
    auth,
    db,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    onAuthStateChanged
  } from './firebase-config.js';

  const MAX_CARS = 10;

  const carForm = document.getElementById('carForm');
  const formTitle = document.getElementById('formTitle');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const backBtn = document.getElementById('backBtn');
  const carsList = document.getElementById('carsList');
  const carCount = document.getElementById('carCount');
  const message = document.getElementById('message');

  const brand = document.getElementById('brand');
  const model = document.getElementById('model');
  const generation = document.getElementById('generation');
  const year = document.getElementById('year');
  const vin = document.getElementById('vin');

  let currentUser = null;
  let cars = [];
  let editingCarId = null;

  function showMessage(text, success = true) {
    message.textContent = text;
    message.style.color = success ? '#66ff66' : '#ff6666';
  }

  function resetForm() {
    editingCarId = null;
    carForm.reset();
    formTitle.textContent = 'Dodaj nowe auto';
    saveBtn.textContent = 'ZAPISZ AUTO';
  }

  async function loadCars() {
    const carsRef = collection(db, 'users', currentUser.uid, 'cars');
    const snap = await getDocs(carsRef);

    cars = [];

    snap.forEach(docSnap => {
      cars.push({
        id: docSnap.id,
        ...docSnap.data()
      });
    });

    cars.sort((a, b) => (a.brand || '').localeCompare(b.brand || ''));

    renderCars();
  }

  function renderCars() {
    carCount.textContent = `${cars.length} / ${MAX_CARS}`;
    carsList.innerHTML = '';

    if (cars.length === 0) {
      carsList.innerHTML = '<div class="empty">Nie dodałeś jeszcze żadnego auta.</div>';
      return;
    }

    cars.forEach(car => {
      const card = document.createElement('div');
      card.className = 'car-card';

      card.innerHTML = `
        <h3>${car.brand || ''} ${car.model || ''}</h3>
        <p><strong>Generacja:</strong> ${car.generation || '-'}</p>
        <p><strong>Rok:</strong> ${car.year || '-'}</p>
        <p><strong>VIN:</strong> ${car.vin || '-'}</p>

        <div class="card-actions">
          <button class="read-btn">CZYTAJ</button>
          <button class="edit-btn">EDYTUJ</button>
          <button class="delete-btn">USUŃ</button>
        </div>
      `;

      card.querySelector('.read-btn').addEventListener('click', () => {
        window.location.href = 'car-dashboard.html?id=' + car.id;
      });

      card.querySelector('.edit-btn').addEventListener('click', () => {
        editingCarId = car.id;
        brand.value = car.brand || '';
        model.value = car.model || '';
        generation.value = car.generation || '';
        year.value = car.year || '';
        vin.value = car.vin || '';

        formTitle.textContent = 'Edytuj auto';
        saveBtn.textContent = 'ZAPISZ ZMIANY';

        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (!confirm('Czy na pewno chcesz usunąć to auto?')) return;

        await deleteDoc(doc(db, 'users', currentUser.uid, 'cars', car.id));
        await loadCars();
        showMessage('Auto zostało usunięte.');
      });

      carsList.appendChild(card);
    });
  }

  onAuthStateChanged(auth, async user => {
    if (!user) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = user;
    await loadCars();
  });

  carForm.addEventListener('submit', async e => {
    e.preventDefault();

    const carData = {
      brand: brand.value.trim(),
      model: model.value.trim(),
      generation: generation.value.trim(),
      year: year.value.trim(),
      vin: vin.value.trim(),
      updatedAt: new Date().toISOString()
    };

    try {
      if (editingCarId) {
        await setDoc(
          doc(db, 'users', currentUser.uid, 'cars', editingCarId),
          carData,
          { merge: true }
        );

        showMessage('Auto zostało zaktualizowane.');
      } else {
        if (cars.length >= MAX_CARS) {
          showMessage('Osiągnięto limit 10 aut.', false);
          return;
        }

        await addDoc(
          collection(db, 'users', currentUser.uid, 'cars'),
          {
            ...carData,
            createdAt: new Date().toISOString()
          }
        );

        showMessage('Auto zostało zapisane.');
      }

      resetForm();
      await loadCars();
    } catch (error) {
      console.error(error);
      showMessage('Błąd zapisu danych.', false);
    }
  });

  cancelBtn.addEventListener('click', () => {
    resetForm();
    showMessage('Edycja anulowana.');
  });

  backBtn.addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
