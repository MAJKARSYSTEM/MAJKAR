<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJKAR - Ubezpieczenie</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.9)),
        url("background.jpg") center/cover no-repeat;
      color: white;
      padding: 35px;
    }

    .page {
      max-width: 1250px;
      margin: 0 auto;
    }

    .topbar,
    .panel,
    .summary-box {
      border: 1px solid #ff1a1a;
      border-radius: 16px;
      background: rgba(0,0,0,.82);
      box-shadow: 0 0 25px rgba(255,0,0,.35);
    }

    .topbar {
      padding: 24px 28px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 5px;
      text-shadow: 0 0 16px red;
    }

    .topbar p {
      margin-top: 8px;
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
    }

    button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #ff1a1a;
      border-radius: 8px;
      color: white;
      background: linear-gradient(90deg, #1a0000, #b00000, #1a0000);
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 11px;
    }

    .back-btn,
    .cancel-btn {
      background: linear-gradient(90deg, #111, #333, #111);
    }

    .edit-btn {
      background: linear-gradient(90deg, #00111a, #005577, #00111a);
    }

    .delete-btn {
      background: linear-gradient(90deg, #240000, #8b0000, #240000);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .summary-box {
      padding: 20px;
      text-align: center;
    }

    .summary-box p {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .summary-box span {
      color: #ff3030;
      font-size: 18px;
      font-weight: 900;
    }

    .panel {
      padding: 26px;
      margin-bottom: 24px;
    }

    .panel h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      background: #111;
      border: 1px solid #ff1a1a;
      color: white;
      font-size: 14px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255,0,0,.25);
      text-align: left;
      font-size: 12px;
    }

    th {
      color: #ff3030;
    }

    .table-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      text-align: center;
      font-size: 12px;
      color: #66ff66;
    }

    @media (max-width: 1000px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: auto;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 18px;
      }

      .topbar {
        flex-direction: column;
        text-align: center;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .form-actions {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">
      <div>
        <h1>UBEZPIECZENIE</h1>
        <p id="carName">Ładowanie auta...</p>
      </div>

      <button class="back-btn" id="backBtn">POWRÓT</button>
    </header>

    <section class="summary">
      <div class="summary-box">
        <p>ŁĄCZNY KOSZT</p>
        <span id="totalCost">0 zł</span>
      </div>

      <div class="summary-box">
        <p>LICZBA POLIS</p>
        <span id="totalEntries">0</span>
      </div>

      <div class="summary-box">
        <p>NAJBLIŻSZY KONIEC</p>
        <span id="nextEnd">Brak</span>
      </div>

      <div class="summary-box">
        <p>STATUS</p>
        <span id="statusBox">Brak</span>
      </div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Dodaj nową polisę</h2>

      <form id="insuranceForm">
        <div class="form-grid">
          <div>
            <label>DATA WYKUPIENIA</label>
            <input id="startDate" type="date" required>
          </div>

          <div>
            <label>DATA ZAKOŃCZENIA</label>
            <input id="endDate" type="date" required>
          </div>

          <div>
            <label>CENA UBEZPIECZENIA</label>
            <input id="price" type="number" step="0.01" min="0" required>
          </div>

          <div>
            <label>UBEZPIECZYCIEL</label>
            <input id="insurer" type="text" required>
          </div>

          <div class="wide">
            <label>NUMER POLISY</label>
            <input id="policyNumber" type="text" required>
          </div>

          <div>
            <label>AKCJA</label>
            <div class="form-actions">
              <button type="submit" id="saveBtn">ZAPISZ</button>
              <button type="button" class="cancel-btn" id="cancelBtn">ANULUJ</button>
            </div>
          </div>
        </div>
      </form>

      <div id="message" class="message"></div>
    </section>

    <section class="panel">
      <h2>Historia polis</h2>

      <table>
        <thead>
          <tr>
            <th>OD</th>
            <th>DO</th>
            <th>UBEZPIECZYCIEL</th>
            <th>NR POLISY</th>
            <th>CENA</th>
            <th>AKCJE</th>
          </tr>
        </thead>

        <tbody id="insuranceTable">
          <tr>
            <td colspan="6">Ładowanie danych...</td>
          </tr>
        </tbody>
      </table>
    </section>

  </div>

  <script type="module">
    import {
      auth,
      db,
      doc,
      getDoc,
      setDoc,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      onAuthStateChanged
    } from "./firebase-config.js";

    const params = new URLSearchParams(window.location.search);
    const carId = params.get("id");

    const carName = document.getElementById("carName");
    const backBtn = document.getElementById("backBtn");
    const form = document.getElementById("insuranceForm");
    const table = document.getElementById("insuranceTable");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("formTitle");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const totalCost = document.getElementById("totalCost");
    const totalEntries = document.getElementById("totalEntries");
    const nextEnd = document.getElementById("nextEnd");
    const statusBox = document.getElementById("statusBox");

    const startDate = document.getElementById("startDate");
    const endDate = document.getElementById("endDate");
    const insurer = document.getElementById("insurer");
    const policyNumber = document.getElementById("policyNumber");
    const price = document.getElementById("price");

    let currentUser = null;
    let policies = [];
    let editingId = null;

    function showMessage(text, success = true) {
      message.textContent = text;
      message.style.color = success ? "#66ff66" : "#ff6666";
    }

    function formatMoney(value) {
      return (Number(value) || 0).toFixed(2).replace(".", ",") + " zł";
    }

    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = "Dodaj nową polisę";
      saveBtn.textContent = "ZAPISZ";
    }

    async function loadCar(user) {
      if (!carId) {
        carName.textContent = "Brak ID auta";
        showMessage("Brak ID auta w adresie.", false);
        return;
      }

      const carRef = doc(db, "users", user.uid, "cars", carId);
      const carSnap = await getDoc(carRef);

      if (!carSnap.exists()) {
        carName.textContent = "Auto nie istnieje";
        showMessage("Nie znaleziono auta.", false);
        return;
      }

      const car = carSnap.data();
      carName.textContent = `${car.brand || ""} ${car.model || ""} ${car.generation || ""}`;
    }

    async function loadPolicies(user) {
      const policiesRef = collection(db, "users", user.uid, "cars", carId, "insurance");
      const snap = await getDocs(policiesRef);

      policies = [];

      snap.forEach(docSnap => {
        policies.push({
          id: docSnap.id,
          ...docSnap.data()
        });
      });

      policies.sort((a, b) => (b.endDate || "").localeCompare(a.endDate || ""));
      renderPolicies();
    }

    function renderPolicies() {
      table.innerHTML = "";

      let sum = 0;

      if (policies.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="6">Brak zapisanych polis. Dodaj pierwszą polisę.</td>
          </tr>
        `;
      }

      policies.forEach(policy => {
        sum += Number(policy.price) || 0;

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${policy.startDate || "-"}</td>
          <td>${policy.endDate || "-"}</td>
          <td>${policy.insurer || "-"}</td>
          <td>${policy.policyNumber || "-"}</td>
          <td>${formatMoney(policy.price)}</td>
          <td>
            <div class="table-actions">
              <button type="button" class="edit-btn">EDYTUJ</button>
              <button type="button" class="delete-btn">USUŃ</button>
            </div>
          </td>
        `;

        row.querySelector(".edit-btn").addEventListener("click", () => {
          editingId = policy.id;
          startDate.value = policy.startDate || "";
          endDate.value = policy.endDate || "";
          insurer.value = policy.insurer || "";
          policyNumber.value = policy.policyNumber || "";
          price.value = policy.price || "";
          formTitle.textContent = "Edytuj polisę";
          saveBtn.textContent = "ZAPISZ ZMIANY";
          showMessage("Tryb edycji polisy.");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        row.querySelector(".delete-btn").addEventListener("click", async () => {
          if (!confirm("Czy na pewno chcesz usunąć tę polisę?")) return;

          try {
            const policyRef = doc(db, "users", currentUser.uid, "cars", carId, "insurance", policy.id);
            await deleteDoc(policyRef);
            await loadPolicies(currentUser);
            showMessage("Polisa usunięta.");
          } catch (error) {
            console.error(error);
            showMessage("Błąd usuwania polisy: " + error.code, false);
          }
        });

        table.appendChild(row);
      });

      totalCost.textContent = formatMoney(sum);
      totalEntries.textContent = policies.length;

      if (policies.length > 0) {
        const today = new Date().toISOString().split("T")[0];

        const sortedByEnd = [...policies].sort((a, b) => (a.endDate || "").localeCompare(b.endDate || ""));
        const nearest = sortedByEnd[0];

        nextEnd.textContent = nearest.endDate || "Brak";
        statusBox.textContent = nearest.endDate >= today ? "AKTYWNA" : "WYGASŁA";
      } else {
        nextEnd.textContent = "Brak";
        statusBox.textContent = "Brak";
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;

      try {
        await loadCar(user);
        await loadPolicies(user);
        showMessage("Ubezpieczenia załadowane.");
      } catch (error) {
        console.error(error);
        showMessage("Błąd ładowania danych: " + error.code, false);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentUser || !carId) {
        showMessage("Brak użytkownika albo ID auta.", false);
        return;
      }

      const policy = {
        startDate: startDate.value,
        endDate: endDate.value,
        insurer: insurer.value.trim(),
        policyNumber: policyNumber.value.trim(),
        price: Number(price.value),
        updatedAt: new Date().toISOString()
      };

      try {
        if (editingId) {
          const policyRef = doc(db, "users", currentUser.uid, "cars", carId, "insurance", editingId);
          await setDoc(policyRef, policy, { merge: true });
          showMessage("Polisa zaktualizowana.");
        } else {
          const policiesRef = collection(db, "users", currentUser.uid, "cars", carId, "insurance");
          await addDoc(policiesRef, {
            ...policy,
            createdAt: new Date().toISOString()
          });
          showMessage("Polisa zapisana.");
        }

        resetForm();
        await loadPolicies(currentUser);
      } catch (error) {
        console.error(error);
        showMessage("Błąd zapisu polisy: " + error.code, false);
      }
    });

    cancelBtn.addEventListener("click", () => {
      resetForm();
      showMessage("Edycja anulowana.");
    });

    backBtn.addEventListener("click", () => {
      window.location.href = "car-dashboard.html?id=" + carId;
    });
  </script>

</body>
</html>
