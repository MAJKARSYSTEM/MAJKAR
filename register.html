<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAJKAR - Rejestracja</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.85)),
        url("background.jpg") center/cover no-repeat;
      color: white;
    }

    .card {
      width: 420px;
      max-width: 92vw;
      padding: 40px;
      border: 2px solid #ff1a1a;
      border-radius: 12px;
      background: rgba(0,0,0,.88);
      box-shadow: 0 0 30px rgba(255,0,0,.45);
    }

    h1 {
      text-align: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 15px red;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      font-size: 14px;
      letter-spacing: 4px;
      color: #ccc;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      height: 52px;
      margin-bottom: 15px;
      padding: 0 15px;
      background: #111;
      border: 1px solid #ff1a1a;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #300, #f00, #300);
      color: white;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,0,.6);
    }

    button:hover {
      filter: brightness(1.1);
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #ff6666;
    }

    .link {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }

    .link a {
      color: #ff1a1a;
      text-decoration: none;
      font-weight: 700;
    }

    .link a:hover {
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>MAJKAR</h1>
    <h2>REJESTRACJA</h2>

    <form id="registerForm">
      <input id="email" type="email" placeholder="EMAIL" required>
      <input id="password" type="password" placeholder="HASŁO MIN. 6 ZNAKÓW" required minlength="6">
      <button type="submit">UTWÓRZ KONTO</button>
    </form>

    <div id="message" class="message"></div>

    <div class="link">
      Masz już konto?
      <a href="index.html">LOGOWANIE</a>
    </div>
  </div>

  <script type="module">
    import { auth, createUserWithEmailAndPassword } from "./firebase-config.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await createUserWithEmailAndPassword(auth, email, password);

        message.style.color = "#66ff66";
        message.textContent = "Konto utworzone!";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (error) {
        message.style.color = "#ff6666";
        message.textContent = "Błąd rejestracji: " + error.code;
      }
    });
  </script>

</body>
</html>
